# Configuração mínima para a CLI do Supabase (supabase link / supabase db push).
project_id = "seasonscore"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://seasonscore.vercel.app"]

# Google fica ativo só no projeto hospedado (configurado no painel do Supabase).
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
