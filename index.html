<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F0F0E" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- share:start (substituído por api/share.ts nas prévias de links) -->
    <title>SeasonScore</title>
    <meta
      name="description"
      content="Avalie séries temporada por temporada e veja onde cada uma cresceu ou caiu."
    />
    <meta property="og:site_name" content="SeasonScore" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SeasonScore" />
    <meta
      property="og:description"
      content="Avalie séries temporada por temporada e veja onde cada uma cresceu ou caiu."
    />
    <meta property="og:image" content="https://seasonscore.vercel.app/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- share:end -->

    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://jitudssddqheithrduij.supabase.co" crossorigin />

    <style>
      body {
        background-color: #0f0f0e;
        color: #edebe5;
        font-family:
          "IBM Plex Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        margin: 0;
        padding: 0;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .app-loading {
        align-items: center;
        display: flex;
        height: 100vh;
        justify-content: center;
        width: 100vw;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">
        <svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
          <circle
            cx="25"
            cy="25"
            r="20"
            fill="none"
            stroke="#26C287"
            stroke-width="4"
            stroke-dasharray="70 30"
          >
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0 25 25"
              to="360 25 25"
              dur="1s"
              repeatCount="indefinite"
            />
          </circle>
        </svg>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
